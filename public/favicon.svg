<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <rect width="32" height="32" rx="7" fill="#181818"/>
  <g transform="translate(3.5, 3.5) scale(0.25)">
    <!-- Top 12 o'clock dot touching circle upper edge -->
    <circle cx="50" cy="7.2" r="4.2" fill="#f5f5f5" />
    
    <!-- Clean, thin circular outline -->
    <circle cx="50" cy="52" r="40" stroke="#f5f5f5" stroke-width="3" />
    
    <!-- Normal standard font S -->
    <text
      x="50"
      y="66"
      text-anchor="middle"
      fill="#f5f5f5"
      font-family="system-ui, -apple-system, 'Inter', 'Helvetica Neue', Arial, sans-serif"
      font-size="44"
      font-weight="600"
    >S</text>
  </g>
</svg>

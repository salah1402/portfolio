<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bg-glow" cx="65%" cy="45%" r="75%" fx="60%" fy="40%">
      <stop offset="0%" stop-color="#1e0b16"/>
      <stop offset="35%" stop-color="#110914"/>
      <stop offset="70%" stop-color="#08070b"/>
      <stop offset="100%" stop-color="#030305"/>
    </radialGradient>
    <radialGradient id="reiatsu-cyan" cx="25%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#4facfe" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="crimson-burst" cx="72%" cy="42%" r="45%">
      <stop offset="0%" stop-color="#ff1744" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#b00020" stop-opacity="0.25"/>
      <stop offset="80%" stop-color="#37000b" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Blade & Mask Gradients -->
    <linearGradient id="blade-edge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#f1f5f9"/>
      <stop offset="60%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="blade-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="crimson-slash" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ff1744"/>
      <stop offset="50%" stop-color="#d50000"/>
      <stop offset="100%" stop-color="#880e4f"/>
    </linearGradient>
    <linearGradient id="cyan-filament" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#00b0ff"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="cyber-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <!-- Deep Obsidian Canvas -->
  <rect width="1600" height="1000" fill="url(#bg-glow)"/>
  <rect width="1600" height="1000" fill="url(#cyber-grid)"/>

  <!-- Energy Atmospheric Fields -->
  <circle cx="1150" cy="450" r="500" fill="url(#crimson-burst)"/>
  <circle cx="400" cy="650" r="450" fill="url(#reiatsu-cyan)"/>

  <!-- High-Precision Diagonal Hairlines & Energy Rays -->
  <g stroke="#ffffff" stroke-opacity="0.08" stroke-width="1">
    <line x1="0" y1="200" x2="1600" y2="800"/>
    <line x1="0" y1="260" x2="1600" y2="860"/>
    <line x1="200" y1="0" x2="1400" y2="1000"/>
    <line x1="0" y1="700" x2="1600" y2="100"/>
  </g>

  <!-- Concentric Reiatsu Shockwave Rings -->
  <g fill="none" stroke="#ff1744" stroke-opacity="0.2" stroke-width="1.5">
    <ellipse cx="1080" cy="480" rx="220" ry="220" stroke-dasharray="8 12"/>
    <ellipse cx="1080" cy="480" rx="340" ry="340" stroke-dasharray="16 20"/>
    <ellipse cx="1080" cy="480" rx="460" ry="460" stroke-dasharray="4 28" stroke-opacity="0.1"/>
  </g>
  <g fill="none" stroke="#00e5ff" stroke-opacity="0.25" stroke-width="1.2">
    <ellipse cx="600" cy="550" rx="280" ry="280" stroke-dasharray="12 16"/>
    <ellipse cx="600" cy="550" rx="420" ry="420" stroke-dasharray="6 24" stroke-opacity="0.12"/>
  </g>

  <!-- Giant Zangetsu Cleaver Silhouette (Diagonal Power Composition) -->
  <g transform="translate(100, -80) rotate(22 800 500)">
    <!-- Blade Shadow / Silhouette Glow -->
    <polygon points="580,120 740,120 860,680 720,860 620,860 520,380" fill="#000000" opacity="0.6"/>
    <!-- Main Blade Spine (Dark Damascus Steel) -->
    <polygon points="590,140 730,140 840,670 710,840 630,840 540,380" fill="url(#blade-dark)"/>
    <!-- Razor Cutting Edge (Gleaming Silver Bevel) -->
    <polygon points="730,140 750,140 860,680 720,850 710,840 840,670" fill="url(#blade-edge)"/>
    <!-- Katana Cloth Bandages / Tensa Wrappings Floating -->
    <path d="M 670,840 Q 640,940 700,1040 T 760,1180" fill="none" stroke="#f1f5f9" stroke-width="14" stroke-linecap="round" opacity="0.85"/>
    <path d="M 685,840 Q 720,950 680,1080 T 630,1220" fill="none" stroke="#e2e8f0" stroke-width="10" stroke-linecap="round" opacity="0.6"/>
    <path d="M 695,850 Q 660,920 720,1010" fill="none" stroke="#ff1744" stroke-width="3" opacity="0.9"/>
  </g>

  <!-- Stylized Hollow Mask Fragment & Crimson Fracture Stripes -->
  <g transform="translate(860, 260)">
    <!-- Mask Bone Base Contour -->
    <path d="M 80,40 C 200,-20 340,60 380,220 C 400,320 360,420 280,480 C 210,530 130,510 70,440 C 20,380 0,260 20,160 Z" fill="#ffffff" fill-opacity="0.94"/>
    <!-- Hollow Eye Cavity (Pitch Abyss with Gold Iris Glow) -->
    <ellipse cx="230" cy="240" rx="42" ry="68" fill="#0a0a0e" transform="rotate(-15 230 240)"/>
    <ellipse cx="232" cy="240" rx="14" ry="24" fill="#ffd700" opacity="0.95"/>
    <ellipse cx="234" cy="240" rx="5" ry="10" fill="#ffffff"/>
    
    <!-- Iconic 5 Crimson Stripes (The Awakening Marks) -->
    <path d="M 80,70 Q 150,140 220,170" stroke="url(#crimson-slash)" stroke-width="16" stroke-linecap="round" fill="none"/>
    <path d="M 120,40 Q 200,120 270,160" stroke="url(#crimson-slash)" stroke-width="20" stroke-linecap="round" fill="none"/>
    <path d="M 170,25 Q 240,110 320,165" stroke="url(#crimson-slash)" stroke-width="18" stroke-linecap="round" fill="none"/>
    <path d="M 230,20 Q 290,110 360,195" stroke="url(#crimson-slash)" stroke-width="15" stroke-linecap="round" fill="none"/>
    <path d="M 290,35 Q 340,120 380,225" stroke="url(#crimson-slash)" stroke-width="12" stroke-linecap="round" fill="none"/>

    <!-- Sharp Teeth Grille / Hollow Jaw -->
    <g fill="#0a0a0e">
      <polygon points="120,420 135,370 145,420"/>
      <polygon points="150,430 165,370 175,430"/>
      <polygon points="180,435 195,372 205,435"/>
      <polygon points="210,432 225,375 235,432"/>
      <polygon points="240,422 255,378 265,422"/>
    </g>
  </g>

  <!-- Getsuga Tensho Energy Wave Arc (Dynamic Slash Across Viewport) -->
  <path d="M 150,920 Q 750,560 1480,180" fill="none" stroke="url(#crimson-slash)" stroke-width="8" stroke-linecap="round" filter="drop-shadow(0 0 16px #ff1744)"/>
  <path d="M 180,940 Q 770,580 1500,200" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
  <path d="M 120,900 Q 730,540 1450,160" fill="none" stroke="url(#cyan-filament)" stroke-width="4" stroke-linecap="round" opacity="0.75" filter="drop-shadow(0 0 12px #00e5ff)"/>

  <!-- Audio Equalizer Telemetry Bars (.eq-bar visualization) -->
  <g transform="translate(140, 720)">
    <rect x="0" y="30" width="6" height="50" rx="3" fill="#ff1744" opacity="0.9"/>
    <rect x="14" y="15" width="6" height="65" rx="3" fill="#ff1744" opacity="0.9"/>
    <rect x="28" y="0" width="6" height="80" rx="3" fill="#00e5ff" opacity="0.95"/>
    <rect x="42" y="25" width="6" height="55" rx="3" fill="#ff1744" opacity="0.9"/>
    <rect x="56" y="45" width="6" height="35" rx="3" fill="#ff1744" opacity="0.7"/>
    <rect x="70" y="10" width="6" height="70" rx="3" fill="#00e5ff" opacity="0.9"/>
    <rect x="84" y="35" width="6" height="45" rx="3" fill="#ff1744" opacity="0.8"/>
    <text x="104" y="65" font-family="'JetBrains Mono', 'Space Grotesk', monospace" font-size="12" font-weight="600" fill="#00e5ff" letter-spacing="2">
      AUDIO-REACTIVE VELOCITY EQ · ACTIVE [60 FPS]
    </text>
  </g>

  <!-- Editorial Top Status Bar -->
  <g transform="translate(140, 110)">
    <rect x="0" y="0" width="280" height="30" rx="15" fill="#1e1b24" stroke="#ff1744" stroke-width="1" stroke-opacity="0.6"/>
    <circle cx="16" cy="15" r="4" fill="#ff1744"/>
    <text x="28" y="19" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#f1f1f1" letter-spacing="1.5">
      CASE STUDY 05 · TRIBUTE
    </text>

    <!-- Japanese Kanji Typography -->
    <text x="310" y="22" font-family="'Noto Serif JP', 'Cinzel', serif" font-size="18" font-weight="700" fill="#ffffff" fill-opacity="0.45" letter-spacing="6">
      護廷十三隊 // 虚化覚醒
    </text>
  </g>

  <!-- High-Ticket Editorial Typography Block -->
  <g transform="translate(140, 240)">
    <text x="0" y="0" font-family="'JetBrains Mono', 'Space Grotesk', monospace" font-size="13" font-weight="600" fill="#ff1744" letter-spacing="3">
      [ INTERACTIVE CINEMATIC SCROLLYTELLING CHRONICLE ]
    </text>
    <text x="0" y="64" font-family="'Bebas Neue', 'Anton', 'Impact', sans-serif" font-size="78" font-weight="900" fill="#ffffff" letter-spacing="1">
      BLEACH: THE HOLLOW WITHIN
    </text>
    <text x="0" y="112" font-family="'Space Grotesk', 'Helvetica Neue', sans-serif" font-size="22" font-weight="400" fill="#94a3b8" letter-spacing="0.5">
      Ichigo Kurosaki's Seven Transformative Awakenings
    </text>
  </g>

  <!-- Bottom Metric & Chapter Navigation Pills -->
  <g transform="translate(140, 890)">
    <!-- Chapter Flow Badges -->
    <g font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#cbd5e1" letter-spacing="1">
      <rect x="0" y="0" width="130" height="34" rx="8" fill="#14151f" stroke="#ffffff" stroke-width="1" stroke-opacity="0.15"/>
      <text x="16" y="22" fill="#00e5ff">ACT 01</text>
      <text x="64" y="22">SUB</text>

      <rect x="145" y="0" width="140" height="34" rx="8" fill="#14151f" stroke="#ffffff" stroke-width="1" stroke-opacity="0.15"/>
      <text x="161" y="22" fill="#00e5ff">ACT 04</text>
      <text x="211" y="22">BANKAI</text>

      <rect x="300" y="0" width="150" height="34" rx="8" fill="#1e0f18" stroke="#ff1744" stroke-width="1" stroke-opacity="0.4"/>
      <text x="316" y="22" fill="#ff1744">ACT 05</text>
      <text x="366" y="22">MUGETSU</text>

      <rect x="465" y="0" width="170" height="34" rx="8" fill="#14151f" stroke="#ffffff" stroke-width="1" stroke-opacity="0.15"/>
      <text x="481" y="22" fill="#00e5ff">ACT 06</text>
      <text x="531" y="22">BLADE IS ME</text>
    </g>

    <!-- Engineering Performance Badges -->
    <g transform="translate(740, 0)" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#94a3b8">
      <text x="0" y="22" letter-spacing="1.5">ENGINE: <tspan fill="#f1f1f1">LENIS + GSAP 3</tspan></text>
      <text x="190" y="22" letter-spacing="1.5">FPS: <tspan fill="#00e5ff">60 LOCKED</tspan></text>
      <text x="330" y="22" letter-spacing="1.5">SPEED: <tspan fill="#ff1744">99/100</tspan></text>
      <text x="460" y="22" letter-spacing="1.5">DEPLOYED: <tspan fill="#ffffff">VERCEL EDGE</tspan></text>
    </g>
  </g>

  <!-- Delicate Hairline Outer Frame -->
  <rect x="30" y="30" width="1540" height="940" rx="12" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/>
</svg>

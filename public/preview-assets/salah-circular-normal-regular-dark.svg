<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <!-- Top 12 o'clock dot touching circle upper edge -->
  <circle cx="50" cy="7.2" r="3.6" fill="#f5f5f5" />
  
  <!-- Clean, thin circular outline -->
  <circle cx="50" cy="52" r="40" stroke="#f5f5f5" stroke-width="2.5" />
  
  <!-- Normal standard font S -->
  <text
    x="50"
    y="66"
    text-anchor="middle"
    fill="#f5f5f5"
    font-family="system-ui, -apple-system, 'Inter', 'Helvetica Neue', Arial, sans-serif"
    font-size="43"
    font-weight="400"
    style="user-select: none;"
  >S</text>
</svg>

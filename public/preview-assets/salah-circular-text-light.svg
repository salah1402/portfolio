<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <!-- Top 12 o'clock dot touching circle upper edge -->
  <circle cx="50" cy="7.2" r="3.6" fill="#1a1a1a" />
  
  <!-- Clean, thin circular outline -->
  <circle cx="50" cy="52" r="40" stroke="#1a1a1a" stroke-width="2.5" />
  
  <!-- Refined modern capital S centered with generous negative space -->
  <text
    x="50"
    y="66.5"
    text-anchor="middle"
    fill="#1a1a1a"
    font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif"
    font-size="42"
    font-weight="600"
    letter-spacing="-0.02em"
    style="user-select: none;"
  >S</text>
</svg>
